<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Français 90">
<meta name="theme-color" content="#1b2a4a">
<title>Français en 90 jours</title>
<style>
  :root{
    --ink:#1b2a4a; --ink-soft:#3a4a6b;
    --paper:#f6f1e7; --paper-card:#fffdf8; --rule:#e3dccb;
    --gold:#b08538; --green:#2f6b46; --green-bg:#e7f0e9;
    --blue-bg:#e8edf6; --amber:#9a6b14; --amber-bg:#fbf3df;
    --red:#a23b2e; --red-bg:#f7e7e4;
    --shadow:0 1px 3px rgba(27,42,74,.08), 0 6px 22px rgba(27,42,74,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;}

  header{position:sticky;top:0;z-index:20;background:var(--ink);color:#f6f1e7;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;box-shadow:0 2px 16px rgba(27,42,74,.18);}
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand .flag{font-size:15px;letter-spacing:2px;}
  .brand h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.3px;}
  .openidx{margin-left:auto;background:transparent;border:1px solid rgba(246,241,231,.3);
    color:#f6f1e7;font-size:12px;padding:6px 11px;border-radius:9px;}
  .progress-wrap{margin-top:11px;height:5px;border-radius:3px;background:rgba(246,241,231,.18);overflow:hidden;}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#d8b25f);border-radius:3px;transition:width .4s ease;}
  .sub{font-size:12px;opacity:.72;margin-top:6px;font-variant-numeric:tabular-nums;}

  main{max-width:680px;margin:0 auto;padding:20px 16px 130px;}
  .daymeta{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .pill{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;background:var(--blue-bg);color:var(--ink);}
  .pill.m1{background:var(--blue-bg);color:#274690;}
  .pill.m2{background:var(--green-bg);color:#2f6b46;}
  .pill.m3{background:var(--amber-bg);color:#8a5a12;}
  .pill.done{background:var(--gold);color:#fff;}
  .dayno{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .foco{font-size:27px;line-height:1.2;margin:2px 0 18px;font-weight:600;}

  .block{background:var(--paper-card);border:1px solid var(--rule);border-radius:14px;
    padding:16px 16px 6px;margin-bottom:16px;box-shadow:var(--shadow);}
  .block h3{margin:0 0 12px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;
    display:flex;align-items:center;gap:7px;}
  .h-voc{color:var(--green);} .h-phr{color:#274690;}
  .h-extra{color:#8a5a12;} .h-convo{color:#6d3b8e;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.g{background:var(--green);} .dot.b{background:#274690;}
  .dot.a{background:#b08538;} .dot.c{background:#6d3b8e;}

  /* mini-conversa */
  .convo .play-all{width:100%;background:#6d3b8e;color:#fff;border:none;border-radius:10px;
    padding:11px 14px;font-size:14px;font-weight:600;margin-bottom:14px;cursor:pointer;}
  .convo .play-all:active{transform:scale(.98);}
  .convo .play-all.playing{background:#54206f;}
  .cline{display:flex;margin-bottom:9px;}
  .cline.a{justify-content:flex-start;}
  .cline.b{justify-content:flex-end;}
  .bubble{max-width:84%;border-radius:14px;padding:9px 12px;}
  .cline.a .bubble{background:#f0e8f6;border:1px solid #e0d0ec;border-bottom-left-radius:4px;}
  .cline.b .bubble{background:var(--blue-bg);border:1px solid #d2ddee;border-bottom-right-radius:4px;}
  .cline-fr{display:flex;align-items:flex-start;gap:7px;font-weight:600;font-size:15px;}
  .cline-pt{color:var(--ink-soft);font-size:13px;margin-top:3px;margin-left:29px;}
  .spk.sm{width:24px;height:24px;font-size:12px;flex:none;}
  .cline.b .spk.sm{order:2;}
  .cline.b .cline-fr{flex-direction:row-reverse;}
  .cline.b .cline-fr span{text-align:right;}
  .cline.b .cline-pt{text-align:right;margin-left:0;margin-right:29px;}

  .pair{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:flex-start;}
  .pair:last-child{border-bottom:none;}
  .frbox{flex:1;display:flex;align-items:flex-start;gap:8px;}
  .fr{font-weight:600;font-size:16px;}
  .pt{flex:1;color:var(--ink-soft);font-size:15px;}
  .spk{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);
    background:#fff;color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;margin-top:-2px;}
  .spk:active{transform:scale(.9);background:var(--blue-bg);}
  .spk.playing{background:var(--ink);color:#fff;border-color:var(--ink);}

  .exo{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--ink);
    border-radius:12px;padding:14px 15px;margin-bottom:16px;box-shadow:var(--shadow);}
  .exo .lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink);margin-bottom:6px;}
  .exo p{margin:0;font-size:16px;}
  .rev{background:var(--amber-bg);border:1px solid #ecdcb4;border-radius:12px;padding:13px 15px;margin-bottom:8px;}
  .rev .lbl{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--amber);margin-bottom:5px;}
  .rev p{margin:0;font-size:15px;color:#6b4e16;}
  .rev-btn{margin-top:11px;width:100%;background:var(--amber);color:#fff;border:none;
    border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;}
  .rev-btn:active{transform:scale(.98);}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(246,241,231,.92);backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--rule);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);}
  .navrow{display:flex;align-items:center;gap:9px;max-width:680px;margin:0 auto;}
  button{font-family:inherit;font-size:15px;border:none;border-radius:12px;padding:13px 15px;
    font-weight:600;cursor:pointer;transition:transform .08s ease,opacity .2s;}
  button:active{transform:scale(.97);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);min-width:50px;}
  .btn-ghost:disabled{opacity:.32;}
  .btn-done{flex:1;background:var(--green);color:#fff;}
  .btn-done.is-done{background:var(--paper-card);color:var(--green);border:1.5px solid var(--green);}
  .btn-test{background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px;}
  .btn-test:disabled{opacity:.32;}

  /* sheet */
  .sheet-mask{position:fixed;inset:0;background:rgba(27,42,74,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;}
  .sheet-mask.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);
    border-radius:18px 18px 0 0;max-height:78vh;transform:translateY(102%);
    transition:transform .3s cubic-bezier(.2,.7,.2,1);
    padding:8px 0 calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -10px 40px rgba(27,42,74,.25);}
  .sheet.open{transform:translateY(0);}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:10px auto 6px;}
  .sheet h2{margin:6px 18px 12px;font-size:16px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 16px;overflow-y:auto;max-height:60vh;}
  .cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--rule);background:var(--paper-card);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
    font-variant-numeric:tabular-nums;cursor:pointer;position:relative;}
  .cell.done{background:var(--green);color:#fff;border-color:var(--green);}
  .cell.current{outline:2.5px solid var(--gold);outline-offset:1px;}
  .cell .check{position:absolute;top:2px;right:4px;font-size:9px;}

  /* ---- TEST (full screen) ---- */
  .test-screen{position:fixed;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column;}
  .test-screen.open{display:flex;}
  .test-top{background:var(--ink);color:#f6f1e7;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px;}
  .test-top .close{background:transparent;border:none;color:#f6f1e7;font-size:22px;padding:0 4px;}
  .test-top .tbar{flex:1;height:6px;border-radius:3px;background:rgba(246,241,231,.2);overflow:hidden;}
  .test-top .tbar > div{height:100%;width:0;background:var(--gold);transition:width .3s;}
  .test-top .tcount{font-size:13px;font-variant-numeric:tabular-nums;opacity:.85;}
  .test-body{flex:1;overflow-y:auto;padding:22px 18px 20px;max-width:680px;margin:0 auto;width:100%;}
  .q-type{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .q-prompt{font-size:22px;line-height:1.35;margin-bottom:6px;}
  .q-prompt.serif{font-weight:600;}
  .q-sub{font-size:14px;color:var(--ink-soft);margin-bottom:20px;}
  .q-audio{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
    padding:14px 20px;border-radius:14px;font-size:17px;margin-bottom:8px;cursor:pointer;}
  .q-audio:active{transform:scale(.97);}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .opt{background:var(--paper-card);border:1.5px solid var(--rule);border-radius:13px;
    padding:15px 16px;font-size:17px;text-align:left;color:var(--ink);position:relative;}
  .opt:active{transform:scale(.99);}
  .opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .opt .mk{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;}

  /* order/build question */
  .build-target{min-height:54px;border:1.5px dashed var(--rule);border-radius:13px;padding:10px;
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;background:var(--paper-card);}
  .bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .tok{background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:9px 13px;font-size:16px;cursor:pointer;}
  .tok:active{transform:scale(.95);}
  .tok.used{opacity:.32;pointer-events:none;}
  .tok.placed{background:var(--blue-bg);border-color:#bcd;}

  .test-foot{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--rule);
    background:rgba(246,241,231,.95);backdrop-filter:blur(10px);}
  .test-foot .inner{max-width:680px;margin:0 auto;display:flex;gap:10px;}
  .btn-check{flex:1;background:var(--ink);color:#fff;}
  .btn-check:disabled{opacity:.35;}
  .btn-next{flex:1;background:var(--green);color:#fff;}
  .feedback{font-size:15px;font-weight:600;margin-bottom:10px;display:none;}
  .feedback.ok{color:var(--green);display:block;}
  .feedback.no{color:var(--red);display:block;}
  .feedback .ans{display:block;font-weight:400;color:var(--ink-soft);margin-top:3px;}

  /* results */
  .results{text-align:center;padding:40px 20px;}
  .results .big{font-size:54px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .results .lbl{font-size:16px;color:var(--ink-soft);margin-bottom:8px;}
  .results .msg{font-size:18px;margin:18px 0 26px;}
  .results .review{text-align:left;margin-top:20px;}
  .results .review h4{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--red);margin:0 0 10px;}
  .rev-item{background:var(--red-bg);border:1px solid #ecc9c2;border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:15px;}
  .rev-item b{color:var(--ink);}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="flag serif">🇫🇷</span>
    <h1 class="serif">Français en 90 jours</h1>
    <button class="openidx" onclick="openSheet()">Todos os dias</button>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="sub" id="progresstxt">0 de 90 dias concluídos</div>
</header>

<main id="main"></main>

<div class="nav">
  <div class="navrow">
    <button class="btn-ghost" id="prev" onclick="go(-1)">‹</button>
    <button class="btn-done" id="doneBtn" onclick="toggleDone()">Marcar como concluído</button>
    <button class="btn-ghost" id="next" onclick="go(1)">›</button>
  </div>
  <div class="navrow" style="margin-top:9px;">
    <button class="btn-test" id="testBtn" style="flex:1;justify-content:center;" onclick="startTest()">
      🎯 <span id="testLabel">Testar o que já vi</span>
    </button>
  </div>
</div>

<!-- index sheet -->
<div class="sheet-mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h2>Toque um dia para ir até ele</h2>
  <div class="grid" id="grid"></div>
</div>

<!-- TEST screen -->
<div class="test-screen" id="testScreen">
  <div class="test-top">
    <button class="close" onclick="quitTest()">✕</button>
    <div class="tbar"><div id="tbarfill"></div></div>
    <span class="tcount" id="tcount"></span>
  </div>
  <div class="test-body" id="testBody"></div>
  <div class="test-foot" id="testFoot"></div>
</div>

<script>
const DAYS = [{"foco":"Cumprimentos","novo":[["Bonjour","Bom dia / Olá (formal)"],["Salut","Oi (informal)"],["Bonsoir","Boa noite (ao chegar)"],["Au revoir","Tchau / Até logo"],["À bientôt","Até breve"],["Merci","Obrigado(a)"]],"frases":[["Bonjour ! Ça va ?","Olá! Tudo bem?"],["Salut, à bientôt !","Oi, até breve!"]],"exercicio":"Diga cada palavra em voz alta 3x. Cumprimente 3 pessoas imaginárias: uma de manhã (Bonjour), uma à noite (Bonsoir), uma amiga (Salut).","revisao":"—","extraFrases":[["Bonjour, monsieur !","Bom dia, senhor!"],["Bonne journée !","Tenha um bom dia!"],["Salut, ça roule ?","Oi, tudo certo?"],["Au revoir, à demain !","Tchau, até amanhã!"]],"dialogo":{"titulo":"Encontro na rua","linhas":[{"who":"A","fr":"Bonjour !","pt":"Olá!"},{"who":"B","fr":"Salut ! Ça va ?","pt":"Oi! Tudo bem?"},{"who":"A","fr":"Ça va, merci. À bientôt !","pt":"Tudo bem, obrigado. Até breve!"},{"who":"B","fr":"Au revoir !","pt":"Tchau!"}]}},{"foco":"Como vai","novo":[["Ça va ?","Tudo bem?"],["Ça va bien","Estou bem"],["Et toi ?","E você? (informal)"],["Et vous ?","E o senhor/a? (formal)"],["Comme ci comme ça","Mais ou menos"],["Pas mal","Nada mal"]],"frases":[["Ça va ? — Ça va bien, merci. Et toi ?","Tudo bem? — Vou bem, obrigado. E você?"]],"exercicio":"Encene o diálogo completo sozinho, fazendo as duas vozes (você e a outra pessoa).","revisao":"Revise: Bonjour, Salut, Au revoir, Merci (Dia 1). Diga cada um 1x.","extraFrases":[["Ça va très bien !","Vou muito bem!"],["Et ta famille, ça va ?","E sua família, tudo bem?"],["Pas terrible aujourd'hui.","Hoje não muito bem."],["Ça va, et toi ?","Tudo bem, e você?"]],"dialogo":{"titulo":"Como você está?","linhas":[{"who":"A","fr":"Salut ! Ça va ?","pt":"Oi! Tudo bem?"},{"who":"B","fr":"Ça va bien, et toi ?","pt":"Vou bem, e você?"},{"who":"A","fr":"Comme ci comme ça.","pt":"Mais ou menos."},{"who":"B","fr":"Ah, courage !","pt":"Ah, força!"}]}},{"foco":"Cortesia","novo":[["S'il vous plaît","Por favor (formal)"],["S'il te plaît","Por fa function mesOf(i){return i<26?1:(i<54?2:3);}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// extrai números de dias citados na instrução de revisão, mantendo só dias já vistos (<= dia atual)
function extractRevDays(txt, curPos){
  if(!txt||txt==="—") return [];
  const set=new Set();
  const re=/Dias?\s+(\d+)(?:\s*[–\-—a]\s*(\d+))?/gi;
  let m;
  while((m=re.exec(txt))){
    const a=parseInt(m[1]); const b=m[2]?parseInt(m[2]):a;
    for(let dd=a; dd<=b; dd++){
      if(dd>=1 && dd<=curPos) set.add(dd-1); // index 0-based, só dias anteriores ao atual
    }
  }
  return [...set].sort((x,y)=>x-y);
}

/* ---------- audio (speech synthesis) ---------- */
let frVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  frVoice = vs.find(v=>/fr-FR/i.test(v.lang)) || vs.find(v=>/^fr/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text, btn){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  // strip the dialogue dash and PT after — keep only french side spoken
  const u=new SpeechSynthesisUtterance(text);
  u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=.9;
  if(btn){ btn.classList.add('playing'); u.onend=()=>btn.classList.remove('playing'); u.onerror=()=>btn.classList.remove('playing'); }
  speechSynthesis.speak(u);
}

/* toca a mini-conversa inteira, fala por fala */
let convoTimer=null;
function playConvo(linhas, btn){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if(convoTimer){ clearTimeout(convoTimer); convoTimer=null; }
  // se já estava tocando, este clique para
  if(btn && btn.classList.contains('playing')){ btn.classList.remove('playing'); return; }
  document.querySelectorAll('.play-all.playing').forEach(b=>b.classList.remove('playing'));
  if(btn) btn.classList.add('playing');
  let i=0;
  function next(){
    if(i>=linhas.length){ if(btn) btn.classList.remove('playing'); return; }
    const u=new SpeechSynthesisUtterance(linhas[i].fr);
    u.lang='fr-FR'; if(frVoice) u.voice=frVoice; u.rate=.9;
    u.onend=()=>{ i++; convoTimer=setTimeout(next, 450); };
    u.onerror=()=>{ if(btn) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  }
  next();
}
function pairRows(arr){
  if(!arr||!arr.length) return "";
  return arr.map((p,i)=>`
    <div class="pair">
      <div class="frbox">
        <button class="spk" onclick="speak(${JSON.stringify(p[0]).replace(/"/g,'&quot;')}, this)" aria-label="Ouvir">🔊</button>
        <span class="fr">${esc(p[0])}</span>
      </div>
      <span class="pt">${esc(p[1])}</span>
    </div>`).join("");
}
function render(){
  const d=DAYS[pos], m=mesOf(pos), isDone=done.has(pos);
  let html=`<div class="daymeta">
      <span class="pill m${m} ${isDone?'done':''}">${isDone?'✓ Concluído':'Mês '+m}</span>
      <span class="dayno">Dia ${pos+1} de 90</span></div>
    <div class="foco serif">${esc(d.foco)}</div>`;
  if(d.novo&&d.novo.length) html+=`<div class="block"><h3 class="h-voc"><span class="dot g"></span>Vocabulário novo</h3>${pairRows(d.novo)}</div>`;
  if(d.frases&&d.frases.length) html+=`<div class="block"><h3 class="h-phr"><span class="dot b"></span>Frases para praticar</h3>${pairRows(d.frases)}</div>`;
  html+=`<div class="exo"><div class="lbl">📝 Exercício do dia</div><p>${esc(d.exercicio)}</p></div>`;

  // MAIS FRASES (extras)
  if(d.extraFrases && d.extraFrases.length){
    html+=`<div class="block"><h3 class="h-extra"><span class="dot a"></span>Mais frases para praticar</h3>${pairRows(d.extraFrases)}</div>`;
  }

  // MINI-CONVERSA
  if(d.dialogo && d.dialogo.linhas && d.dialogo.linhas.length){
    html+=`<div class="block convo"><h3 class="h-convo"><span class="dot c"></span>Mini-conversa${d.dialogo.titulo?` · ${esc(d.dialogo.titulo)}`:''}</h3>`;
    html+=`<button class="play-all" onclick='playConvo(${JSON.stringify(d.dialogo.linhas).replace(/'/g,"&#39;")}, this)'>▶︎ Ouvir a conversa toda</button>`;
    d.dialogo.linhas.forEach(l=>{
      html+=`<div class="cline ${l.who==='A'?'a':'b'}">
        <div class="bubble">
          <div class="cline-fr"><button class="spk sm" onclick="speak(${JSON.stringify(l.fr).replace(/"/g,'&quot;')}, this)">🔊</button><span>${esc(l.fr)}</span></div>
          <div class="cline-pt">${esc(l.pt)}</div>
        </div></div>`;
    });
    html+=`</div>`;
  }
  document.getElementById("main").innerHTML=html;
  window.scrollTo(0,0);

  document.getElementById("prev").disabled=pos===0;
  document.getElementById("next").disabled=pos===DAYS.length-1;
  const b=document.getElementById("doneBtn");
  if(isDone){b.classList.add("is-done");b.textContent="✓ Concluído — refazer?";}
  else{b.classList.remove("is-done");b.textContent="Marcar como concluído";}

  // test button enabled only if there's prior material (day>=2 i.e. pos>=1)
  const tb=document.getElementById("testBtn");
  const tl=document.getElementById("testLabel");
  if(pos<1){ tb.disabled=true; tl.textContent="Teste libera no Dia 2"; }
  else{ tb.disabled=false; tl.textContent="Testar tudo até o Dia "+pos; }

  updateProgress();
  localStorage.setItem(POSKEY,pos);
}
function updateProgress(){
  const n=done.size;
  document.getElementById("bar").style.width=(n/DAYS.length*100)+"%";
  document.getElementById("progresstxt").textContent=n+" de 90 dias concluídos";
}
function toggleDone(){
  if(done.has(pos)) done.delete(pos);
  else{ done.add(pos); if(pos<DAYS.length-1){saveDone(done);render();setTimeout(()=>go(1),180);return;} }
  saveDone(done);render();
}
function go(delta){const np=pos+delta;if(np<0||np>=DAYS.length)return;pos=np;render();}

/* index sheet */
function buildGrid(){
  document.getElementById("grid").innerHTML=DAYS.map((d,i)=>{
    const cls=["cell"];if(done.has(i))cls.push("done");if(i===pos)cls.push("current");
    return `<div class="${cls.join(' ')}" onclick="jump(${i})">${i+1}${done.has(i)?'<span class="check">✓</span>':''}</div>`;
  }).join("");
}
function openSheet(){buildGrid();document.getElementById("mask").classList.add("open");document.getElementById("sheet").classList.add("open");}
function closeSheet(){document.getElementById("mask").classList.remove("open");document.getElementById("sheet").classList.remove("open");}
function jump(i){pos=i;closeSheet();render();}

/* swipe between days (disabled while test open) */
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(document.getElementById("testScreen").classList.contains("open"))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);
},{passive:true});

/* ===================== TEST ENGINE ===================== */
let test=null; // {items:[], idx, correct, wrongList:[]}
// pool global (todo o curso) usado só para gerar opções erradas plausíveis
const globalPool=(()=>{ const v=[],p=[]; DAYS.forEach((d,i)=>{
  (d.novo||[]).forEach(x=>{if(x[0]&&x[1])v.push({fr:x[0],pt:x[1],day:i+1});});
  (d.frases||[]).forEach(x=>{if(x[0]&&x[1])p.push({fr:x[0],pt:x[1],day:i+1});});
  (d.extraFrases||[]).forEach(x=>{if(x[0]&&x[1])p.push({fr:x[0],pt:x[1],day:i+1});});
  (d.dialogo&&d.dialogo.linhas||[]).forEach(l=>{if(l.fr&&l.pt)p.push({fr:l.fr,pt:l.pt,day:i+1});});
}); return {vocab:v,phrases:p,all:v.concat(p)};})();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clean(fr){ // french side without dialogue PT, for tokens
  return fr.replace(/\s*—.*$/,'').trim();
}
function isSimplePhrase(fr){ // good for "ordenar": no dash, 3-7 words, no digits-heavy
  const f=clean(fr); const w=f.split(/\s+/);
  return !/—/.test(fr) && w.length>=3 && w.length<=7;
}

// Build a pool from days 0..uptoIndex (inclusive). uptoIndex = pos-1 (dia anterior).
function buildPool(uptoIndex){
  const vocab=[], phrases=[];
  for(let i=0;i<=uptoIndex;i++){
    (DAYS[i].novo||[]).forEach(p=>{ if(p[0]&&p[1]) vocab.push({fr:p[0],pt:p[1],day:i+1}); });
    (DAYS[i].frases||[]).forEach(p=>{ if(p[0]&&p[1]) phrases.push({fr:p[0],pt:p[1],day:i+1}); });
    (DAYS[i].extraFrases||[]).forEach(p=>{ if(p[0]&&p[1]) phrases.push({fr:p[0],pt:p[1],day:i+1}); });
    (DAYS[i].dialogo&&DAYS[i].dialogo.linhas||[]).forEach(l=>{ if(l.fr&&l.pt) phrases.push({fr:l.fr,pt:l.pt,day:i+1}); });
  }
  return {vocab,phrases,all:vocab.concat(phrases)};
}

// proportional question count: grows with how much you've seen
function questionCount(uptoIndex){
  const daysSeen=uptoIndex+1;            // dia 2 -> 1 dia visto ; dia 30 -> 29 vistos
  let n=Math.round(daysSeen*0.7)+3;      // ~ proporcional
  return Math.max(4, Math.min(24, n));   // entre 4 e 24
}

function makeMCQ_fr2pt(item, pool){
  const distract=shuffle(pool.all.filter(x=>x.pt!==item.pt)).slice(0,3).map(x=>x.pt);
  const opts=shuffle([item.pt,...distract]);
  return {type:"Traduza para o português", kind:"mcq", promptFr:clean(item.fr), audio:clean(item.fr),
    options:opts, answer:item.pt};
}
function makeMCQ_pt2fr(item, pool){
  const distract=shuffle(pool.all.filter(x=>x.fr!==item.fr)).slice(0,3).map(x=>clean(x.fr));
  const opts=shuffle([clean(item.fr),...distract]);
  return {type:"Como se diz em francês?", kind:"mcq", promptPt:item.pt,
    options:opts, answer:clean(item.fr)};
}
function makeListen(item, pool){
  const distract=shuffle(pool.all.filter(x=>x.pt!==item.pt)).slice(0,3).map(x=>x.pt);
  const opts=shuffle([item.pt,...distract]);
  return {type:"Ouça e escolha o significado", kind:"listen", audio:clean(item.fr),
    options:opts, answer:item.pt};
}
function makeOrder(item){
  const words=clean(item.fr).replace(/[?!.,]/g,'').split(/\s+/);
  return {type:"Monte a frase na ordem certa", kind:"order",
    promptPt:item.pt, words:shuffle(words), answer:clean(item.fr).replace(/[?!.]/g,'').trim()};
}

function startTest(){
  if(pos<1) return;
  const upto=pos-1;
  const pool=buildPool(upto);
  if(pool.all.length<4){ alert("Ainda há pouco conteúdo para um teste. Avance mais um dia."); return; }

  const count=questionCount(upto);
  const items=[];
  const sourcesV=shuffle(pool.vocab);
  const sourcesAll=shuffle(pool.all);
  const sourcesP=shuffle(pool.phrases);
  const simpleP=shuffle(pool.phrases.filter(p=>isSimplePhrase(p.fr)));
  const pick=(arr,i)=> arr.length? arr[i % arr.length] : null;
  let vi=0, ai=0, pi=0, si=0;
  for(let k=0;k<count;k++){
    const r=Math.random();
    let q=null;
    if(r<0.34){ const it=pick(sourcesV,vi++); if(it) q=makeMCQ_fr2pt(it,pool); }
    else if(r<0.58){ const it=pick(sourcesAll,ai++); if(it) q=makeMCQ_pt2fr(it,pool); }
    else if(r<0.80){ const it=pick(sourcesP,pi++)||pick(sourcesV,vi++); if(it) q=makeListen(it,pool); }
    else {
      const it=pick(simpleP,si++);
      if(it) q=makeOrder(it);
      else { const it2=pick(sourcesV,vi++); if(it2) q=makeMCQ_fr2pt(it2,pool); }
    }
    if(q) items.push(q);
  }
  test={items, idx:0, correct:0, wrongList:[]};
  document.getElementById("testScreen").classList.add("open");
  document.body.style.overflow="hidden";
  renderQuestion();
}
// monta um pool só com os dias indicados (índices 0-based)
function buildPoolFromDays(dayIdxs){
  const vocab=[], phrases=[];
  dayIdxs.forEach(i=>{
    (DAYS[i].novo||[]).forEach(p=>{ if(p[0]&&p[1]) vocab.push({fr:p[0],pt:p[1],day:i+1}); });
    (DAYS[i].frases||[]).forEach(p=>{ if(p[0]&&p[1]) phrases.push({fr:p[0],pt:p[1],day:i+1}); });
  });
  return {vocab,phrases,all:vocab.concat(phrases)};
}

// mini-teste focado nos dias da revisão
function startReview(dayIdxs){
  if(!dayIdxs||!dayIdxs.length) return;
  const pool=buildPoolFromDays(dayIdxs);
  if(pool.all.length<2){ alert("Conteúdo de revisão muito curto."); return; }

  // mini-teste: curto, no máximo ~8 questões, baseado no material disponível
  const count=Math.max(3, Math.min(8, pool.all.length));
  const items=[];
  const sourcesV=shuffle(pool.vocab.length?pool.vocab:pool.all);
  const sourcesAll=shuffle(pool.all);
  const sourcesP=shuffle(pool.phrases);
  const simpleP=shuffle(pool.phrases.filter(p=>isSimplePhrase(p.fr)));
  const pick=(arr,i)=> arr.length? arr[i % arr.length] : null;
  let vi=0, ai=0, pi=0, si=0;
  for(let k=0;k<count;k++){
    const r=Math.random();
    let q=null;
    if(r<0.34){ const it=pick(sourcesV,vi++); if(it) q=makeMCQ_fr2pt(it,globalPool); }
    else if(r<0.60){ const it=pick(sourcesAll,ai++); if(it) q=makeMCQ_pt2fr(it,globalPool); }
    else if(r<0.82){ const it=pick(sourcesP,pi++)||pick(sourcesV,vi++); if(it) q=makeListen(it,globalPool); }
    else { const it=pick(simpleP,si++); if(it) q=makeOrder(it); else { const it2=pick(sourcesV,vi++); if(it2) q=makeMCQ_fr2pt(it2,globalPool); } }
    if(q) items.push(q);
  }
  test={items, idx:0, correct:0, wrongList:[], isReview:true, _revDays:dayIdxs};
  document.getElementById("testScreen").classList.add("open");
  document.body.style.overflow="hidden";
  renderQuestion();
}

function quitTest(){
  speechSynthesis.cancel();
  document.getElementById("testScreen").classList.remove("open");
  document.body.style.overflow="";
  test=null;
}

let selected=null, placed=[];
function renderQuestion(){
  const q=test.items[test.idx];
  selected=null; placed=[];
  document.getElementById("tcount").textContent=(test.isReview?"Revisão · ":"")+(test.idx+1)+" / "+test.items.length;
  document.getElementById("tbarfill").style.width=((test.idx)/test.items.length*100)+"%";

  const body=document.getElementById("testBody");
  let html=`<div class="q-type">${q.type}</div>`;

  if(q.kind==="mcq"){
    if(q.promptFr){
      html+=`<div class="q-prompt serif">${esc(q.promptFr)}</div>
             <div class="q-audio" onclick="speak(${JSON.stringify(q.audio).replace(/"/g,'&quot;')}, null)">🔊 Ouvir</div>`;
    } else {
      html+=`<div class="q-prompt">${esc(q.promptPt)}</div>`;
    }
    html+=`<div class="opts">`+q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pickOpt(this)">${esc(o)}</button>`).join("")+`</div>`;
  }
  else if(q.kind==="listen"){
    html+=`<div class="q-audio" onclick="speak(${JSON.stringify(q.audio).replace(/"/g,'&quot;')}, null)" style="font-size:20px;padding:18px 26px;">🔊 Tocar áudio</div>
           <div class="q-sub">Toque para ouvir quantas vezes quiser.</div>
           <div class="opts">`+q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pickOpt(this)">${esc(o)}</button>`).join("")+`</div>`;
  }
  else if(q.kind==="order"){
    html+=`<div class="q-prompt">${esc(q.promptPt)}</div>
           <div class="q-sub">Toque nas palavras na ordem correta:</div>
           <div class="build-target" id="target"></div>
           <div class="bank" id="bank">`+q.words.map((w,i)=>`<button class="tok" data-w="${esc(w)}" data-i="${i}" onclick="placeTok(this)">${esc(w)}</button>`).join("")+`</div>`;
  }
  body.innerHTML=html;
  body.scrollTop=0;

  // auto-play audio for listen
  if(q.kind==="listen"){ setTimeout(()=>speak(q.audio,null), 350); }

  renderFoot(false);
}

function pickOpt(btn){
  if(test._answered) return;
  document.querySelectorAll(".opt").forEach(o=>o.style.outline="");
  selected=btn.dataset.i; btn.style.outline="2.5px solid var(--ink)";
  document.getElementById("checkBtn").disabled=false;
}
function placeTok(btn){
  if(test._answered) return;
  btn.classList.add("used");
  placed.push(btn.dataset.w);
  const t=document.getElementById("target");
  const chip=document.createElement("button");
  chip.className="tok placed"; chip.textContent=btn.dataset.w;
  chip.onclick=()=>{ if(test._answered)return; chip.remove(); btn.classList.remove("used"); placed=placed.filter((_,i)=>i!==[...t.children].indexOf(chip)); rebuildPlaced(); };
  t.appendChild(chip);
  document.getElementById("checkBtn").disabled=placed.length===0;
}
function rebuildPlaced(){ const t=document.getElementById("target"); placed=[...t.children].map(c=>c.textContent); }

function renderFoot(answered){
  const foot=document.getElementById("testFoot");
  if(!answered){
    foot.innerHTML=`<div class="inner"><button class="btn-check" id="checkBtn" disabled onclick="checkAnswer()">Verificar</button></div>`;
  }
}

function checkAnswer(){
  const q=test.items[test.idx];
  test._answered=true;
  let ok=false, given="";
  if(q.kind==="order"){
    rebuildPlaced();
    given=placed.join(" ");
    ok = given.toLowerCase()===q.answer.toLowerCase();
    document.querySelectorAll("#bank .tok").forEach(t=>t.classList.add("used"));
  } else {
    const opts=document.querySelectorAll(".opt");
    given = selected!=null ? q.options[selected] : "";
    ok = given===q.answer;
    opts.forEach(o=>{
      const val=o.textContent;
      if(val===q.answer) o.classList.add("correct");
      else if(o.dataset.i===selected) o.classList.add("wrong");
      o.style.outline="";
    });
  }
  if(ok) test.correct++;
  else test.wrongList.push({q, given});

  const foot=document.getElementById("testFoot");
  const ansLine = q.kind==="mcq"&&q.promptPt ? q.answer : (q.kind==="order"?q.answer:q.answer);
  foot.innerHTML=`
    <div class="inner" style="flex-direction:column;align-items:stretch;">
      <div class="feedback ${ok?'ok':'no'}">${ok?'✓ Correto !':'✗ Quase…'}
        ${ok?'':`<span class="ans">Resposta: <b>${esc(ansLine)}</b></span>`}</div>
      <button class="btn-next" onclick="nextQuestion()">${test.idx<test.items.length-1?'Próxima':'Ver resultado'}</button>
    </div>`;
}

function nextQuestion(){
  test._answered=false;
  if(test.idx<test.items.length-1){ test.idx++; renderQuestion(); }
  else showResults();
}

function showResults(){
  speechSynthesis.cancel();
  document.getElementById("tbarfill").style.width="100%";
  document.getElementById("tcount").textContent="Fim";
  const total=test.items.length, c=test.correct, pct=Math.round(c/total*100);
  let msg, emoji;
  if(pct>=85){msg="Excelente! Você domina esse conteúdo.";emoji="🎉";}
  else if(pct>=60){msg="Bom trabalho! Já está fixando bem.";emoji="👏";}
  else if(pct>=40){msg="Está progredindo — revise os pontos abaixo.";emoji="💪";}
  else {msg="Tudo bem, é assim que se aprende. Revise e tente de novo.";emoji="🌱";}

  let html=`<div class="results">
    <div class="lbl">Você acertou</div>
    <div class="big">${c}<span style="font-size:26px;color:var(--ink-soft)">/${total}</span></div>
    <div class="msg">${emoji} ${msg}</div>`;
  if(test.wrongList.length){
    html+=`<div class="review"><h4>Para revisar (${test.wrongList.length})</h4>`+
      test.wrongList.map(w=>{
        const fr = w.q.kind==="mcq"&&w.q.promptFr ? w.q.promptFr
                 : w.q.kind==="order" ? w.q.answer
                 : (w.q.audio||w.q.answer);
        const pt = w.q.answer && (w.q.kind==="mcq"&&w.q.promptPt) ? w.q.promptPt
                 : (w.q.kind==="order"? w.q.promptPt : w.q.answer);
        const frShow = w.q.kind==="mcq"&&w.q.promptPt ? w.q.answer : (w.q.audio||fr);
        const ptShow = w.q.kind==="mcq"&&w.q.promptPt ? w.q.promptPt : (w.q.kind==="order"? w.q.promptPt : w.q.answer);
        return `<div class="rev-item">
          <button class="spk" style="float:right;" onclick="speak(${JSON.stringify(frShow).replace(/"/g,'&quot;')}, this)">🔊</button>
          <b>${esc(frShow)}</b><br><span style="color:var(--ink-soft)">${esc(ptShow)}</span></div>`;
      }).join("")+`</div>`;
  }
  html+=`</div>`;
  document.getElementById("testBody").innerHTML=html;
  if(test.isReview){
    const dayIdxsJson=JSON.stringify(test._revDays||[]);
    document.getElementById("testFoot").innerHTML=`<div class="inner" style="gap:10px;">
        <button class="btn-ghost" style="flex:1;" onclick="quitTest()">Fechar</button>
        <button class="btn-next" style="flex:1;" onclick='startReview(${dayIdxsJson})'>Refazer</button>
      </div>`;
  } else {
    document.getElementById("testFoot").innerHTML=`<div class="inner" style="gap:10px;">
        <button class="btn-ghost" style="flex:1;" onclick="quitTest()">Fechar</button>
        <button class="btn-next" style="flex:1;" onclick="startTest()">Novo teste</button>
      </div>`;
  }
}

render();
</script>
